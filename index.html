<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team Workboard · GRPS</title>
<meta name="description" content="GRPS Team Workboard: run the monthly data review cycle, keep next steps moving, and finish the monthly form in one place.">
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root{
  --blue:#075a9c;--deep:#12385b;--orange:#f58220;--orange-ink:#a84a00;--gold:#f6b619;
  --ink:#1f2f3c;--muted:#5a6b78;--line:#dde5eb;--soft:#f5f7f9;--paper:#fff;
  --sky:#eaf3fa;--peach:#fff2e6;--green:#2f7a45;--green-bg:#e9f5ec;--red:#a33a2a;--red-bg:#fbebe8;
  --radius:14px;--shadow:0 1px 2px #12385b0d,0 4px 14px #12385b0a;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--soft);color:var(--ink);font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{color:var(--deep);line-height:1.2;margin:0}
h1{font-size:clamp(28px,3.4vw,38px);letter-spacing:-.015em}
h2{font-size:23px}
h3{font-size:19px}
p{margin:0 0 10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Header + navigation */
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-in{max-width:1200px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;flex:0 0 auto}
.brand img{width:112px;height:auto;display:block}
.brand-txt{border-left:1px solid var(--line);padding-left:14px;line-height:1.25}
.brand-txt b{display:block;color:var(--deep);font-size:17px}
.brand-txt span{color:var(--muted);font-size:14px}
.nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{white-space:nowrap;text-decoration:none;color:var(--deep);font-weight:650;font-size:15px;padding:9px 13px;border-radius:9px}
.nav a:hover{background:var(--soft)}
.nav a[aria-current="page"]{background:var(--sky);color:var(--blue)}
.accent{height:3px;background:linear-gradient(90deg,var(--orange) 0 33%,var(--gold) 33% 66%,var(--blue) 66%)}

.wrap{max-width:1200px;margin:0 auto;padding:28px 24px 70px}
.crumb{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:650;color:var(--blue);text-decoration:none;margin-bottom:14px}
.kicker{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--orange-ink);margin-bottom:6px}
.lede{color:var(--muted);font-size:18px;max-width:760px;margin-top:8px}
.muted{color:var(--muted)}
.small{font-size:15px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:22px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:10px;border:1px solid transparent;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;line-height:1.2;text-align:center}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:hover{background:#064c84}
.btn.warm{background:var(--orange);color:#1d2a35}
.btn.warm:hover{background:#e47410}
.btn.ghost{background:#fff;border-color:#c9d6e0;color:var(--deep)}
.btn.ghost:hover{border-color:var(--blue)}
.btn.quiet{background:transparent;color:var(--blue);padding:8px 10px;min-height:40px}
.btn.quiet:hover{background:var(--sky)}
.btn.sm{min-height:38px;padding:7px 13px;font-size:15px}
.btn.danger{background:#fff;border-color:#e3c0b9;color:var(--red)}
.btn:focus-visible,.nav a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-visible{outline:3px solid #f6b61999;outline-offset:2px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Surfaces */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.card+.card{margin-top:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.cardhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 12px;margin-bottom:12px;min-height:40px}
aside .cardhead{flex-direction:column;align-items:flex-start}
.cardhead h2,.cardhead h3{margin:0}
.count{display:inline-block;min-width:26px;padding:1px 9px;border-radius:999px;background:var(--sky);color:var(--blue);font-size:14px;font-weight:800;text-align:center;margin-left:6px;vertical-align:2px}
.empty{border:1px dashed #c8d4dd;border-radius:11px;padding:16px;color:var(--muted);font-size:16px;background:#fbfcfd}
.note{background:var(--sky);border-radius:11px;padding:13px 15px;font-size:16px}
.note.warm{background:var(--peach)}
.note.ok{background:var(--green-bg)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;letter-spacing:.02em;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--green-bg);color:var(--green)}
.pill.warn{background:var(--peach);color:var(--orange-ink)}
.pill.blue{background:var(--sky);color:var(--blue)}
.pill.red{background:var(--red-bg);color:var(--red)}

/* Month hero */
.month{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);overflow:hidden;margin-bottom:22px}
.month-main{padding:28px 30px}
.month-main h1{margin:4px 0 8px}
.month-main p{color:var(--muted);font-size:17px;max-width:600px}
.month-side{background:var(--deep);color:#fff;padding:26px 28px;display:flex;flex-direction:column;gap:12px}
.month-side h3{color:#fff;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.cycle{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.cycle li{display:flex;gap:12px;align-items:center;font-size:16px}
.cycle .dot{flex:0 0 28px;height:28px;border-radius:50%;border:2px solid #ffffff55;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
.cycle li.done .dot{background:var(--gold);border-color:var(--gold);color:var(--deep)}
.cycle li.now .dot{border-color:var(--orange);color:#fff;background:var(--orange)}
.cycle li span small{display:block;color:#c9dbea;font-size:14px}

/* Lists */
.list{list-style:none;margin:0;padding:0}
.list>li{padding:12px 0;border-top:1px solid var(--line)}
.list>li:first-child{border-top:0;padding-top:2px}
.act{display:flex;gap:12px;align-items:flex-start}
.act input[type=checkbox]{width:22px;height:22px;margin-top:2px;accent-color:var(--green);flex:0 0 auto}
.act .what{font-weight:650;color:var(--deep)}
.act.isdone .what{text-decoration:line-through;color:var(--muted)}
.meta{font-size:14px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:650}
.prow{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:16px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0;padding-top:4px}
.prow h3 a{text-decoration:none;color:var(--deep)}
.prow h3 a:hover{text-decoration:underline}
.prow p{margin:4px 0 0;font-size:16px}
.mrow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-size:16px}
.mrow:first-child{border-top:0}

/* Stage track */
.track{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0 4px}
.track button{border:0;background:#edf2f6;color:var(--muted);border-radius:8px;padding:10px 6px;font-size:14px;font-weight:750;cursor:pointer}
.track button.done{background:#dcebf6;color:var(--blue)}
.track button.on{background:var(--deep);color:#fff}
.mini-track{display:inline-flex;gap:3px;vertical-align:middle}
.mini-track i{width:18px;height:6px;border-radius:3px;background:#dfe7ed}
.mini-track i.on{background:var(--blue)}

/* Forms */
label.f{display:block;font-weight:700;color:var(--deep);font-size:16px;margin:16px 0 6px}
label.f small{display:block;font-weight:400;color:var(--muted);font-size:14px;margin-top:2px}
.in{width:100%;border:1px solid #c9d6e0;border-radius:10px;padding:11px 13px;background:#fff;font-size:16px;line-height:1.45}
textarea.in{min-height:96px;resize:vertical}
textarea.in.tall{min-height:140px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid #c9d6e0;background:#fff;border-radius:999px;padding:7px 13px;font-size:15px;font-weight:650;color:var(--deep);cursor:pointer}
.chip:hover{border-color:var(--blue)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.starters{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.starter{border:1px dashed #b9cad7;background:#fbfdfe;border-radius:8px;padding:5px 10px;font-size:14px;color:var(--deep);cursor:pointer}
.starter:hover{background:var(--sky);border-style:solid}
.avoid{font-size:14px;color:var(--red);margin:6px 0 0}

/* Meeting */
.steps{display:flex;gap:6px;margin:6px 0 22px;overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step{flex:1 0 auto;min-width:118px;border:0;text-align:left;background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 13px;cursor:pointer}
.step b{display:block;font-size:15px;color:var(--deep)}
.step span{font-size:13px;color:var(--muted)}
.step.on{background:var(--deep);border-color:var(--deep)}
.step.on b,.step.on span{color:#fff}
.step.done b:before{content:"✓ ";color:var(--green)}
.timer{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px 8px 16px}
.timer .clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:20px;color:var(--deep);min-width:64px}
.timer .clock.over{color:var(--orange-ink)}
.timer .bar{flex:1;height:6px;background:#e7edf2;border-radius:3px;overflow:hidden;min-width:60px}
.timer .bar i{display:block;height:100%;background:var(--blue);width:0}
.timer .bar i.over{background:var(--orange)}
.phases{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 18px}
.phase{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 10px;cursor:pointer;text-align:left}
.phase b{display:block;color:var(--deep);font-size:15px}
.phase span{font-size:13px;color:var(--muted)}
.phase.on{border-color:var(--orange);background:var(--peach)}
.phase.has b:after{content:" ●";color:var(--green);font-size:11px;vertical-align:2px}
.dstabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.dstab{border:1px solid #c9d6e0;background:#fff;border-radius:10px;padding:8px 14px;font-weight:700;color:var(--deep);cursor:pointer;font-size:15px}
.dstab.on{background:var(--sky);border-color:var(--blue);color:var(--blue)}
.norms{display:flex;flex-wrap:wrap;gap:6px}
.norms span{background:var(--soft);border-radius:8px;padding:5px 10px;font-size:14px}
.arow{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px;background:#fcfdfe}
.arow .fgrid label.f{margin-top:10px}
.footnav{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}
.saved{font-size:14px;color:var(--green);font-weight:650;opacity:0;transition:opacity .3s}
.saved.show{opacity:1}

/* Form helper */
.q{border-top:1px solid var(--line);padding:14px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:start}
.q:first-of-type{border-top:0}
.q .qn{font-size:14px;color:var(--muted);font-weight:700}
.q .qa{white-space:pre-wrap;font-size:16px;grid-column:1}
.q .qa.blank{color:var(--red);font-style:italic}
.q .btn{grid-row:1/span 2;grid-column:2}

/* Data calendar */
.months{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:thin}
.months button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;font-weight:700;color:var(--deep);cursor:pointer;font-size:15px;white-space:nowrap}
.months button.on{background:var(--deep);color:#fff;border-color:var(--deep)}
.months button.now{border-color:var(--orange)}
.ds{border-top:1px solid var(--line);padding:15px 0;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:14px}
.ds:first-child{border-top:0}
.ds h3{font-size:18px}
.ds .lbl{font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.rel{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
.rel:first-child{border-top:0}
.rel b{color:var(--deep)}
.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.linkcard{display:block;border:1px solid var(--line);border-radius:12px;padding:15px 16px;text-decoration:none;background:#fff;color:var(--ink)}
.linkcard:hover{border-color:var(--blue);box-shadow:var(--shadow)}
.linkcard b{display:block;color:var(--deep);font-size:17px;margin-bottom:3px}
.linkcard span{font-size:15px;color:var(--muted)}
.linkcard b:after{content:" ↗";color:var(--blue);font-weight:400}

/* Parking lot */
.plot{border-top:1px solid var(--line);padding:16px 0}
.plot:first-child{border-top:0;padding-top:4px}
.plot .qtext{font-weight:700;color:var(--deep);font-size:17px}
.plot details{margin-top:8px}
.plot summary{cursor:pointer;color:var(--blue);font-weight:650;font-size:15px}

/* Priority page */
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 14px;font-size:16px}
.kv dt{font-weight:700;color:var(--deep)}
.kv dd{margin:0}
.timeline{list-style:none;margin:0;padding:0 0 0 16px;border-left:2px solid #d6e1e9}
.timeline li{position:relative;padding:0 0 14px;font-size:15px}
.timeline li:before{content:"";position:absolute;left:-22px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--orange)}
.timeline b{display:block;color:var(--deep);font-size:14px}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th{text-align:left;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 8px 8px 0;border-bottom:1px solid var(--line)}
table.t td{padding:10px 8px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}

/* Sample banner, modal, toast */
.banner{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;background:var(--peach);border:1px solid #f6d3b3;border-radius:12px;padding:12px 16px;margin-bottom:18px;font-size:16px}
.modal{position:fixed;inset:0;background:#0f2a3d73;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .box{background:#fff;border-radius:16px;width:min(640px,100%);max-height:90vh;overflow:auto;padding:24px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--deep);color:#fff;padding:11px 18px;border-radius:10px;font-weight:650;font-size:15px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{max-width:1200px;margin:0 auto;padding:0 24px 40px;color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (max-width:960px){
  .split,.month{grid-template-columns:minmax(0,1fr)}
  .g3{grid-template-columns:1fr 1fr}
  .ds{grid-template-columns:1fr 1fr}.ds>div:first-child{grid-column:1/-1}
}
@media (max-width:700px){
  body{font-size:16px}
  .top-in{flex-wrap:wrap;gap:6px 12px;padding:8px 14px}
  .brand img{width:92px}
  .brand-txt{display:none}
  .nav{margin-left:0;width:100%;order:3}
  .nav a{padding:8px 10px;font-size:14px}
  .wrap{padding:20px 14px 60px}
  .g2,.g3,.fgrid,.links,.rel,.ds{grid-template-columns:1fr}
  .month-main,.month-side{padding:22px 20px}
  .card{padding:18px}
  .phases{grid-template-columns:1fr 1fr}
  .track{grid-template-columns:repeat(5,minmax(0,1fr))}
  .track button{font-size:12px;padding:9px 2px}
  .kv{grid-template-columns:1fr}
  .prow{flex-direction:column;align-items:flex-start}
  .q{grid-template-columns:1fr}.q .btn{grid-row:auto;grid-column:1;justify-self:start}
  .timer{flex-wrap:wrap}
}
@media print{
  .top,.foot,.noprint,.btn,.toast{display:none!important}
  body{background:#fff;font-size:12pt}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  .wrap{padding:0}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#/" aria-label="Team Workboard home">
      <img src="images/grps-logo.png" alt="Grand Rapids Public Schools">
      <span class="brand-txt"><b>Team Workboard</b><span id="brand-sub">Monthly data review cycle</span></span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#/">Home</a>
      <a href="#/meeting">Meeting</a>
      <a href="#/priorities">Priorities</a>
      <a href="#/parking">Parking lot</a>
      <a href="#/data">Data calendar</a>
      <a href="#/resources">Resources</a>
    </nav>
  </div>
  <div class="accent"></div>
</header>
<main class="wrap" id="app" tabindex="-1"></main>
<footer class="foot noprint">
  <span>Your work saves automatically in this browser on this device. <a href="#/settings">Save a copy or switch devices</a>.</span>
  <span>GRPS Community &amp; Student Affairs · Data Conversation Protocol adapted from NWEA</span>
</footer>
<div id="modal"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ===========================================================
   GRPS Team Workboard v2
   One store, hash routes, plain render functions.
   =========================================================== */

const KEY = 'grpsWorkboard.v2';
const OLD_KEY = 'grpsWorkboard6';
const FORM_URL = 'https://forms.gle/ZfhYE9gcJVwbUuCb9';
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const STAGES = [
  ['focus','Focus','Frame the question before looking at data.'],
  ['observe','Observe','What the data show, without explaining why.'],
  ['explain','Explain','Possible causes and what more we need to know.'],
  ['plan','Plan','Action, owner, timeline, and how we will know.'],
  ['monitor','Monitor','Check whether the action is working.']
];
const NORMS = ['Pausing','Paraphrasing','Posing questions','Putting ideas on the table','Providing data','Paying attention to self and others','Presuming positive intentions'];
const CAILS = ['Kelly Greene','Maleika Brown','Mayda Gunnell'];

/* --- Reference content from the shared Data Review Cycles folder --- */
const LINKS = {
  folder:'https://drive.google.com/drive/folders/1p1oQJdx_qt1lu4iTob7KRH69UcvGNMm1',
  process:'https://drive.google.com/file/d/1lFI0q-e718l796YGfvoxIiQ8pBVU12Fq/view',
  agenda:'https://docs.google.com/document/d/1DINTmpLIgxKqS35NXrZiG2ML3DqfEP-WS53-Vx1SYpY/edit',
  parking:'https://docs.google.com/document/d/1kLJQg1Aj_8bke24y0Lcr-1kjvc_pb7VNw2YmOQBDJNE/edit',
  calendar:'https://drive.google.com/file/d/1R-kAmg8PRVNoeJeiIOOJ3cWSY5qGH_ci/view',
  assess:'https://drive.google.com/file/d/1CN_Sp69Zt2PCKu4GLBBMowZY24wbqzgV/view',
  platforms:'https://docs.google.com/document/d/1bUxMNlxlrCgzPIN9cD4wwsDCAvJ4TCHPGB8BIyD7CdE/edit',
  rp:'https://drive.google.com/file/d/1YmLafogLqaSDarTGaPE4OnVGWBlIWby-/view',
  survey:'https://drive.google.com/file/d/1jArJZGuPjiyJOGvfpbrjYOcuv3DZ_UfR/view',
  mtss:'https://docs.google.com/presentation/d/1eI8xlEyrPTnFp7OqREA_hjJI68ePjSbkofIdp-EtLBw/edit',
  actionFolder:'https://drive.google.com/drive/folders/1X6Aekf2JTk0zqmFjucjGQ6MjuOH0uMQ0'
};
const PLATFORMS = [
  ['MI School Data','School Index, graduation rates, EL growth, public state reporting.','https://www.mischooldata.org/'],

let S;
function blank(){ return {version:2,school:'',team:'',cail:'',sample:false,priorities:[],meetings:[],parking:[]}; }
function load(){
  try { const v = JSON.parse(localStorage.getItem(KEY)||'null'); if (v && v.version===2) return normalize(v); } catch(e){}
  try { const old = JSON.parse(localStorage.getItem(OLD_KEY)||'null'); if (old && Array.isArray(old.priorities)) return migrate(old); } catch(e){}
  return blank();
}
function normalize(v){
  const b = blank();
  const x = Object.assign(b, v);
  x.priorities = (x.priorities||[]).map(normP);
  x.meetings = (x.meetings||[]).map(m => Object.assign({roles:{},datasets:[],actions:[],objectives:[]}, m));
  x.parking = x.parking||[];
  return x;
}
function normP(p){
  return Object.assign({id:uid(),title:'Untitled priority',areas:[],issue:'',know:'',since:'',next:'',stage:'focus',status:'active',evidence:{},tried:[],questions:[],history:[]}, p);
}
function stageFromOld(p){
  const w = String(p.where||'');
  if (/OBSERVE/i.test(w)) return 'observe';
  if (/FOCUS/i.test(w)) return 'focus';
  if (/EXPLAIN|understanding/i.test(w)) return 'explain';
  if (p.tried && p.tried.length) return 'monitor';
  return 'explain';
}
function migrate(old){
  // Bring work saved by the previous version forward without losing anything.
  const x = blank();
  x.team = old.team && old.team !== 'School Team' ? old.team : '';
  const seedTitles = ['Grade 9 Success','Grade 3 Literacy','Climate & Belonging'];
  x.sample = old.priorities.length === 3 && old.priorities.every((p,i)=>p.title===seedTitles[i]) && !(old.parking||[]).length;
  x.priorities = old.priorities.map(p => normP(Object.assign({}, p, {
    id: String(p.id), stage: stageFromOld(p),
    status: p.status==='closed' ? 'closed' : p.status==='paused' ? 'paused' : 'active',
    history: (p.history||[]).map(h => Array.isArray(h) ? {date:'', label:h[0], text:h[1]} : h)
  })));
  x.parking = (old.parking||[]).map(k => ({id:uid(), q:k.q, owner:k.owner||'', next:k.next||'', answer:'', status:'open', created:todayISO()}));
  return x;
}
let saveT;
function save(quiet){
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ toast('Could not save in this browser. Download a copy from Settings.'); return; }
  if (!quiet) { const el=$('#saved'); if(el){ el.classList.add('show'); clearTimeout(saveT); saveT=setTimeout(()=>el.classList.remove('show'),1200);} }
}

function meetingRoute(id, step){

function setStep(i){ M.step = i; save(true); go('#/meeting/'+M.id+'/'+i); }

function meetingView(){
  const step = MSTEPS[mStep];

  const stepBtns = MSTEPS.map((s,i)=>`<button class="step ${i===mStep?'on':''} ${i<mStep||(i<4&&stepHas(i))?'done':''}" onclick="setStep(${i})" ${i===mStep?'aria-current="step"':''}><b>${s.name}</b><span>${s.min?s.min+' min':'Last step'}</span></button>`).join('');
  const body = [stepOpen, stepBack, stepData, stepClose, ()=>''][mStep]();

  app.innerHTML = `${sampleBanner()}

      <div class="btnrow">${mStep>0?`<button class="btn ghost" onclick="setStep(${mStep-1})">← ${MSTEPS[mStep-1].name}</button>`:`<a class="btn ghost" href="#/">← Home</a>`}<span class="saved" id="saved">Saved</span></div>

function stepHas(i){
  if (i===0) return !!(M.roles.facilitator||M.roles.participants);
  if (i===1) return !!M.backNotes || (previousMeeting(M)||{actions:[]}).actions.some(a=>a.status&&a.status!=='open');
  if (i===2) return M.datasets.some(d=>d.observe);
  if (i===3) return !!(M.plus||M.delta||M.bring);
  return false;
}

/* Timer */
let tState = null;
function toggleTimer(min){
  if (!tState) { tState = {start:Date.now(), acc:0, min, run:true}; tick(); tState.iv = setInterval(tick, 1000); }
  else if (tState.run) { tState.acc += Date.now()-tState.start; tState.run=false; clearInterval(tState.iv); }
  else { tState.start = Date.now(); tState.run=true; tState.iv = setInterval(tick, 1000); }
  const b=$('#tbtn'); if(b) b.textContent = tState.run ? 'Pause' : 'Resume';
}
function tick(){
  if(!tState) return;
  const ms = tState.acc + (tState.run ? Date.now()-tState.start : 0), s = Math.floor(ms/1000);
  const c=$('#clock'), bar=$('#tbar'); if(!c) return stopTimer();
  c.textContent = Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  const over = s > tState.min*60; c.classList.toggle('over', over);
  bar.style.width = Math.min(100, s/(tState.min*60)*100)+'%'; bar.classList.toggle('over', over);
}
function stopTimer(){ if (tState){ clearInterval(tState.iv); tState=null; } }

/* ===================== SUMMARY + FORM ===================== */
function formAnswers(m){
  const ds = m.datasets.filter(d=>d.name);
  const acts = m.actions.filter(a=>a.what);
  const per = (key) => ds.filter(d=>d[key]).map(d => ds.length>1 ? `${d.name}: ${d[key].trim()}` : d[key].trim()).join('\n\n');
  const list = (key) => acts.length>1 ? acts.filter(a=>a[key]).map((a,i)=>`${acts.indexOf(a)+1}. ${a[key]}`).join('\n') : (acts[0]&&acts[0][key])||'';
  const roles = [m.roles.facilitator&&'Facilitator: '+m.roles.facilitator, m.roles.timekeeper&&'Timekeeper: '+m.roles.timekeeper, m.roles.noteTaker&&'Note taker: '+m.roles.noteTaker].filter(Boolean).join('; ');

function markSubmitted(id){

    m.datasets.filter(d=>d.priorityId && findP(d.priorityId)).forEach(d => {

/* ===================== SETTINGS ===================== */
function settingsView(){
  app.innerHTML = `<div class="pagehead"><div><div class="kicker">Settings</div><h1>Your workboard</h1><p class="lede">Your work is saved in this browser on this device. To use it on another device or share it with your team, save a copy and open it there.</p></div></div>
  <div class="grid g2">
    <section class="card"><h2>Building and team</h2>
      <label class="f" for="st-s">Building</label><input class="in" id="st-s" value="${esc(S.school)}">
      <label class="f" for="st-c">CAIL</label><input class="in" id="st-c" list="cail-list2" value="${esc(S.cail)}"><datalist id="cail-list2">${CAILS.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
      <label class="f" for="st-t">Team name</label><input class="in" id="st-t" value="${esc(S.team)}">
      <button class="btn primary" style="margin-top:16px" onclick="S.school=$('#st-s').value.trim();S.cail=$('#st-c').value.trim();S.team=$('#st-t').value.trim();save(true);toast('Saved.');route()">Save</button></section>
    <section class="card"><h2>Save a copy</h2><p class="muted">Download your work as a file. Keep it in your team’s Drive folder, or open it on another device.</p>
      <div class="grid" style="margin-top:12px"><button class="btn primary" onclick="exportData()">Download a copy</button>
      <label class="btn ghost" style="cursor:pointer">Open a saved copy<input type="file" accept=".json,application/json" onchange="importData(event)" class="sr"></label></div>
      <hr style="border:0;border-top:1px solid var(--line);margin:20px 0">
      <h3>Start over</h3><p class="small muted">Download a copy first. This clears everything in this browser.</p>
      <div class="btnrow"><button class="btn danger sm" onclick="if(confirm('Clear all workboard data in this browser?')){S=blank();save(true);go('#/')}">Clear everything</button>
      <button class="btn quiet sm" onclick="if(!S.priorities.length&&!S.meetings.length||confirm('Replace your work with sample work?')) loadSample()">Load sample work</button></div></section>
  </div>`;
}
function exportData(){
  const blob = new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = ((S.school||'GRPS')+' Team Workboard '+todayISO()).replace(/[^a-z0-9 -]+/gi,'').replace(/\s+/g,'_')+'.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),800); toast('Copy downloaded.');
}
function importData(e){
  const f = e.target.files && e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => { try { const x = JSON.parse(r.result);
      if (x && x.version===2) S = normalize(x); else if (x && Array.isArray(x.priorities)) S = migrate(x); else throw 0;
      save(true); toast('Saved copy opened.'); go('#/'); } catch(err){ toast('That file isn’t a Team Workboard copy.'); } };
  r.readAsText(f);
}

/* --- Modal --- */
function modal(html){
  $('#modal').innerHTML = `<div class="modal" onclick="if(event.target===this)closeModal()"><div class="box" role="dialog" aria-modal="true">${html}</div></div>`;
  document.addEventListener('keydown', escClose);
}
function escClose(e){ if(e.key==='Escape') closeModal(); }
function closeModal(){ $('#modal').innerHTML=''; document.removeEventListener('keydown', escClose); }

/* --- Start --- */
S = load(); save(true);
route();
</script>
