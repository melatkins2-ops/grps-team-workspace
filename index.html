let D=JSON.parse(localStorage.getItem("grpsWorkboard6")||"null")||seed,cur=null;const app=document.getElementById("app"),modal=document.getElementById("modal");

function home(){let active=D.priorities.filter(p=>!p.status||p.status==="active"),paused=D.priorities.filter(p=>p.status==="paused"),closed=D.priorities.filter(p=>p.status==="closed");app.innerHTML=`<section class="home-welcome"><div class="hero-kicker">GRAND RAPIDS PUBLIC SCHOOLS</div><h1>GRPS Team Workspace</h1><p>Use this space to understand what scholars need, decide on next steps, and keep your team's work moving between meetings.</p></section><section class="home-start" aria-label="Choose how to begin"><h2>What would you like to do today?</h2><div class="start-grid"><button class="start-choice featured" onclick="startNew()"><span class="start-icon">＋</span><span class="start-copy"><strong>Start something new</strong><span>Have a question or concern? We'll help you focus the conversation, find the evidence you need, and decide where to begin.</span></span><span class="start-arrow" aria-hidden="true">→</span></button><button class="start-choice" onclick="document.getElementById('current-work').scrollIntoView({behavior:'smooth'})"><span class="start-icon">↗</span><span class="start-copy"><strong>Continue our work</strong><span>Pick up where your team left off, including unfinished questions and next steps.</span></span><span class="start-arrow" aria-hidden="true">→</span></button><button class="start-choice" onclick="meetingPrep()"><span class="start-icon">☷</span><span class="start-copy"><strong>Get ready for a meeting</strong><span>See what has changed, what needs attention, and what your team needs to discuss.</span></span><span class="start-arrow" aria-hidden="true">→</span></button></div><details class="process-details"><summary>How this works <span class="summary-hint">Our four-step GRPS process</span></summary><div class="process-steps"><div><b>1 · Focus</b><span>What are we trying to understand? Agree on the question or concern.</span></div><div><b>2 · Observe</b><span>What does the evidence show? Look for patterns using more than one source.</span></div><div><b>3 · Explain</b><span>Why might this be happening? Explore possible reasons and check assumptions.</span></div><div><b>4 · Plan</b><span>What will we do about it? Agree on actions, owners, and how to check results.</span></div></div><p class="process-note">Keep checking what changed and adjust the plan as you learn more.</p></details></section><section id="current-work" class="home-current"><div class="current-heading"><div><h2>Your team's current work</h2><p>See where things stand and pick up the next step.</p></div><div class="current-counts"><span><b>${active.length}</b> active</span><span><b>${paused.length}</b> paused</span><span><b>${closed.length}</b> closed</span></div></div><div class="priority-grid">${active.map(p=>`<article class="priority-card"><div><h3>${esc(p.title)}</h3><div class="tags">${(p.areas||[]).map(a=>`<span class="tag">${esc(a)}</span>`).join("")}</div></div><p>${esc(p.where)}</p><div class="next-step"><b>WHAT HAPPENS NEXT</b><p>${esc(p.next)}</p></div><button class="btn primary" onclick="openP(${p.id})">Continue this work →</button></article>`).join("")||`<div class="card empty-priorities"><h3>No active priorities yet</h3><p>Start with a question your team wants to understand.</p><button class="btn primary" onclick="startNew()">Start something new</button></div>`}</div><div class="home-foot"><div><b>Need help deciding what to discuss?</b><p>See what needs more information, a decision, or a check-in.</p></div><button class="btn ghost" onclick="teamPulse()">See what needs attention →</button></div><div class="home-foot"><div><b>Need data or a copy of your work?</b><p>Open GRPS data resources or save a backup of this browser's workspace.</p></div><div class="home-foot-actions"><button class="btn ghost" onclick="dataNow()">Find data</button><button class="btn ghost" onclick="backupSettings()">Save a copy</button></div></div></section>`}
function openP(id){cur=D.priorities.find(p=>p.id===id);app.innerHTML=`<div class="top"><div><div class="label">${cur.areas.map(esc).join(" + ")}</div><h1>${esc(cur.title)}</h1></div><button class="btn ghost" onclick="home()">← Workboard</button></div><div class="workspace"><div>

<div class="card"><div class="label">Our question</div><div class="synthesis">${esc(cur.issue)}</div>${phaseBar(cur)}<div class="micro">The GRPS four-step process. You can return to an earlier step when new information changes your thinking.</div><div class="section"><div class="label">Current understanding</div><div class="muted" style="font-size:14px">${esc(cur.know)}</div></div></div>

<div class="card"><div class="label">Questions we still need to answer</div>${cur.questions.map(q=>`<div class="question">${esc(q)}</div>`).join("")}<div class="section"><div class="label">What happens next</div><table class="moves"><tr><th>Action</th><th>Owner</th><th>By when</th></tr>${cur.moves.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table></div><div class="section"><div class="label">Before leaving this priority</div><div class="pulse"><div class="pulsebox"><b>What did we learn or change today?</b>${esc(cur.since)}</div><div class="pulsebox"><b>What should we come back to?</b>${esc((cur.questions&&cur.questions[0])||cur.next)}</div><div class="pulsebox"><b>Who will take the next step?</b>${esc((cur.moves&&cur.moves[0]&&cur.moves[0][1])||"Owner not yet assigned")}</div></div></div><div class="row"><div style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn ghost" onclick="editPriority()">Update work</button><button class="btn ghost" onclick="dataNow(cur.id)">Find data for this question</button><button class="btn ghost" onclick="resourcesForWork()">Resources for this work</button><button class="btn ghost" onclick="analysisWorkbench()">Look at the evidence</button><button class="btn ghost" onclick="planReviewWorkbench()">Make a plan / Check results</button><button class="btn ghost" onclick="closePriorityFlow()">Finish or pause</button></div><button class="btn primary" onclick="helpThink()">Help us figure out the next step</button></div></div>

function helpThink(){let tips=[];let ev=cur.evidence;if(/FOCUS \+ OBSERVE/i.test(cur.where))tips.push("You are still in FOCUS / OBSERVE. Stay with what the evidence shows before moving to causes or solutions. When the pattern is clear enough, move to EXPLAIN: Why might this be?");if(ev.Implementation&&/14 of 18|gap|not|partial/i.test(ev.Implementation))tips.push("You have an implementation gap. Before judging the response, understand why the intended scholars did not all receive it.");if(cur.areas.includes("Attendance")&&cur.areas.includes("Academics"))tips.push("This priority includes attendance and academics. Keep checking whether the same scholars are driving both patterns rather than reviewing the two sets of evidence separately.");if(cur.questions.length)tips.push("The team already has an unresolved question. Answer that before adding another strategy or broadening the problem.");if(cur.areas.length>1)tips.push("This is a cross-domain priority. Compare evidence at the scholar/group level when possible; district or school averages can hide whether the same scholars are driving each pattern.");if(Object.keys(cur.evidence||{}).length<2)tips.push("The original GRPS process expects multiple pieces of evidence. This priority currently has fewer than two evidence sources in view.");if(!cur.tried.length)tips.push("You have not selected a response yet. That may be appropriate: use the current evidence to strengthen the explanation before moving to action.");let phase=phaseOf(cur);let advance=phase===1?`<button class="btn primary" onclick="moveToExplain()">Explore possible reasons</button>`:phase===2?`<button class="btn primary" onclick="moveToPlan()">Make a plan</button>`:`<button class="btn primary" onclick="closeModal()">Back to the work</button>`;showModal(`<div class="label">Help us figure out the next step</div><h2>Based on what your team has recorded</h2>${tips.map(t=>`<div class="help">${esc(t)}</div>`).join("")||`<div class="help">No obvious gap is visible from the current record. Keep the open question in front of the team.</div>`}<div class="row"><button class="btn ghost" onclick="closeModal()">Back</button>${advance}</div>`)}
function editPriority(){showModal(`<div class="label">Update this work</div><h2>Add what has changed since the last meeting. You do not need to start over.</h2><label class="muted">Since last time</label><textarea class="input" id="us">${esc(cur.since)}</textarea><label class="muted">What we know now</label><textarea class="input" id="uk">${esc(cur.know)}</textarea><label class="muted">Next</label><textarea class="input" id="un">${esc(cur.next)}</textarea><label class="muted">Add one open question</label><input class="input" id="uq" placeholder="Optional"><div class="row"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveUpdate()">Save update</button></div>`)}
function saveUpdate(){cur.since=us.value.trim();cur.know=uk.value.trim();cur.next=un.value.trim();if(uq.value.trim())cur.questions.push(uq.value.trim());cur.history.push([new Date().toLocaleDateString("en-US",{month:"short",day:"numeric"}),"Priority updated"]);save();closeModal();openP(cur.id)}
function today(){let ps=D.priorities.filter(p=>!p.status||p.status==='active');app.innerHTML=`<div class="top"><div><div class="label">Today's meeting</div><h1>${esc(D.team)}</h1><div class="muted">Use the original GRPS meeting rhythm while keeping the team's ongoing priorities in view.</div></div><button class="btn ghost" onclick="home()">Exit meeting</button></div><div class="card"><div class="label">90-minute GRPS meeting rhythm</div><div class="evidence"><div class="ev"><b>OPEN · 20 MIN</b>Check-in · norms · objectives · previous goals/action steps</div><div class="ev"><b>DATA CONVERSATION · 60 MIN</b>Focus → Observe → Explain → Plan using 2–3 relevant pieces of evidence</div><div class="ev"><b>CLOSE · 10 MIN</b>Next steps · communication · accountability · Plus/Delta</div><div class="ev"><b>MEETING ROLES</b>Facilitator · timekeeper · note taker · active participants</div></div></div><div class="today">${ps.map(p=>`<div class="todayitem"><b>${esc(p.title)}</b><br><span class="muted">What we know so far:</span> ${esc(p.where)}<br><span class="muted">What is new:</span> ${esc(p.since)}<br><span class="muted">Next move:</span> ${esc(p.next)}<div style="margin-top:7px"><button class="btn ghost" onclick="openP(${p.id})">Work on this priority</button></div></div>`).join("")}</div><div class="card" style="margin-top:12px"><div class="label">Before the team leaves</div><div class="closegrid"><div class="statusnote"><b>Next steps</b><br>Is each action clear, owned, and time-bound?</div><div class="statusnote"><b>Communication</b><br>Who else needs to know what the team learned or decided?</div><div class="statusnote"><b>Questions to revisit</b><br>What question, data need, or unfinished issue must carry forward?<div style="margin-top:7px"><button class="btn ghost" onclick="parkingLot()">Add item</button></div></div><div class="statusnote"><b>Plus / Delta</b><br>What helped this meeting? What should change next time?</div></div></div>`}
function startNew(){window._newWork=window._newWork||{areas:[]};showModal(`<div class="label">START SOMETHING NEW · FOCUS</div><h2>What's bringing your team together?</h2><div class="muted">You don't need a perfectly worded question or all the data to begin. Start with what your team has noticed.</div><div class="startchoice"><label for="nf"><b>What are you noticing or concerned about?</b><span>Use your own words. We'll help turn it into a question to explore.</span></label><textarea class="input" id="nf" rows="3" placeholder="Example: More ninth-grade scholars are missing first period, and several are also falling behind in English.">${esc(window._newWork.focus||"")}</textarea><div class="label" style="margin-top:14px">Which areas might be connected?</div><div class="muted">Choose any that apply. You can change these later.</div><div class="areachoices">${["Academics","Attendance","Behavior / PBIS+","School climate / belonging","Scholar or family experience","Other / not sure"].map(x=>`<label class="areachip"><input type="checkbox" name="newarea" value="${x}" ${window._newWork.areas.includes(x)?"checked":""}> ${x}</label>`).join("")}</div><label for="ns"><b>What brought this to your attention?</b><span>A data point, conversation, observation, or concern is enough to start.</span></label><textarea class="input" id="ns" rows="2" placeholder="Example: Our attendance review and ninth-grade team both raised this concern.">${esc(window._newWork.surfaced||"")}</textarea></div><div class="startnote"><b>You can start even if you're unsure.</b> The next step helps your team decide what it needs to check before making a plan.</div><div class="row"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="startObserve()">Continue: What should we check? →</button></div>`)}
function startObserve(){let focus=nf.value.trim(),surfaced=ns.value.trim(),areas=[...document.querySelectorAll('input[name="newarea"]:checked')].map(x=>x.value);if(!focus)return alert("Tell us what your team has noticed or is concerned about.");window._newWork={...window._newWork,focus,surfaced,areas};let w=window._newWork;showModal(`<div class="label">OBSERVE · WHAT SHOULD WE CHECK?</div><h2>What would help us understand this?</h2><div class="startnote"><b>Your starting point</b><br>${esc(w.focus)}</div><div class="muted">Look at two or three useful pieces of evidence when available. You can save your question now and come back to the evidence later.</div><div class="startchoice"><label for="ne1"><b>What do you already know?</b><span>Use a number, pattern, observation, or something scholars or families have told you.</span></label><textarea class="input" id="ne1" rows="2" placeholder="Example: First-period absences have increased since September.">${esc(w.ev1||"")}</textarea><label for="ne2"><b>What else could help confirm or challenge that picture?</b><span>Choose a different source or another perspective if possible.</span></label><textarea class="input" id="ne2" rows="2" placeholder="Example: Compare first-period absences with course performance and ask scholars about barriers.">${esc(w.ev2||"")}</textarea><label for="ne3"><b>One more source, if useful (optional)</b></label><input class="input" id="ne3" placeholder="Optional third source" value="${esc(w.ev3||"")}"><label for="no"><b>What pattern do you see so far?</b><span>Describe what you see, not why you think it happened. It's fine to say you don't know yet.</span></label><textarea class="input" id="no" rows="2" placeholder="Example: The same group of scholars may be showing up in both sets of data.">${esc(w.obs||"")}</textarea></div><div class="row"><button class="btn ghost" onclick="backToNew()">← Back</button><button class="btn primary" onclick="createInvestigation()">Save and open this work →</button></div>`)}
function backToNew(){let w=window._newWork||{};w.ev1=ne1.value;w.ev2=ne2.value;w.ev3=ne3.value;w.obs=no.value;startNew()}
function createInvestigation(){let w=window._newWork||{},ev=[ne1.value.trim(),ne2.value.trim(),ne3.value.trim()].filter(Boolean),obs=no.value.trim(),id=Date.now(),needsEvidence=ev.length<2;let p={id,title:w.focus.length>70?w.focus.slice(0,67)+"…":w.focus,areas:w.areas||[],where:needsEvidence?"FOCUS / OBSERVE — gather evidence before explaining the pattern.":"FOCUS / OBSERVE — compare evidence before explaining the pattern.",since:w.surfaced||"A new question was raised.",next:needsEvidence?"Identify the evidence needed to understand this question.":"Compare the evidence and describe the pattern before exploring explanations.",issue:w.focus,know:obs?`What we notice so far: ${obs}`:"The team has not described a pattern yet.",evidence:{},tried:[],questions:[needsEvidence?"What other evidence would help us understand this?":"Do these sources tell the same story?","What do we still need to learn before deciding what to do?"],moves:[[needsEvidence?"Identify another useful evidence source":"Compare the evidence and describe the pattern","Team","Next meeting"]],history:[[new Date().toLocaleDateString("en-US",{month:"short",day:"numeric"}),"FOCUS: question recorded"],[new Date().toLocaleDateString("en-US",{month:"short",day:"numeric"}),needsEvidence?"OBSERVE: evidence still needed":"OBSERVE: initial evidence recorded"]]};if(w.surfaced)p.know+=` What brought this up: ${w.surfaced}`;ev.forEach((x,i)=>p.evidence["Evidence "+(i+1)]=x);if(!ev.length)p.evidence["Evidence needed"]="Identify two or three useful sources when available.";D.priorities.push(p);save();window._newWork=null;closeModal();openP(id)}
function analysisWorkbench(){let ev=Object.entries(cur.evidence||{});showModal(`<div class="label">LOOK AT THE EVIDENCE</div><h2>Look closely at the evidence before deciding what to do</h2><div class="muted">First, describe what the evidence shows. Then, discuss what might explain it.</div><div class="section"><div class="label">1 · Put 2–3 pieces of evidence in view</div><div class="obsgrid">${ev.length?ev.slice(0,3).map(([k,v])=>`<div class="obsbox"><b>${esc(k)}</b>${esc(v)}</div>`).join(""):`<div class="obsbox"><b>Evidence needed</b>Add the 2–3 most useful pieces of evidence for this question.</div>`}</div></div><div class="section"><div class="label">2 · OBSERVE — what does the evidence actually show?</div><div class="micro">Use “I see…”, “I notice…”, “I can count…”. Avoid causes and solutions here.</div><textarea class="input" id="ob1" placeholder="What pattern, trend, difference, similarity, or concentration do you see?"></textarea><div class="checkrow"><input type="checkbox" id="obWho"><label for="obWho"><b>Who?</b> Is the pattern widespread or concentrated among particular scholars/groups?</label></div><div class="checkrow"><input type="checkbox" id="obWhen"><label for="obWhen"><b>When / where?</b> Does it change by grade, course, period, day, classroom, setting, or time?</label></div><div class="checkrow"><input type="checkbox" id="obSame"><label for="obSame"><b>Same scholars?</b> If multiple domains are involved, are the same scholars driving the patterns?</label></div><div class="checkrow"><input type="checkbox" id="obImpl"><label for="obImpl"><b>Implementation?</b> Do we know whether the intended practice/support actually occurred?</label></div><div class="checkrow"><input type="checkbox" id="obExp"><label for="obExp"><b>Experience?</b> Is there scholar, family, or staff experience evidence that helps us understand the pattern?</label></div></div><div class="section"><div class="label">3 · What do these pieces of evidence tell us together?</div><select class="input" id="obRel"><option value="">Choose what best describes the evidence</option><option>The evidence points in the same direction</option><option>The evidence is mixed</option><option>The evidence appears to conflict</option><option>We are looking at different groups/settings and cannot compare them fairly yet</option><option>We still need another kind of evidence</option></select></div><div class="row"><button class="btn ghost" onclick="closeModal()">Back</button><button class="btn primary" onclick="interpretObserve()">Interpret what we observed</button></div>`)}
function interpretObserve(){let obs=ob1.value.trim(),rel=obRel.value;if(!obs)return alert("Add what the team observes in the evidence.");let checked=[obWho.checked?"who/groups":"",obWhen.checked?"when/settings":"",obSame.checked?"same scholars across domains":"",obImpl.checked?"implementation":"",obExp.checked?"experience":""].filter(Boolean);let msg="";if(rel==="The evidence points in the same direction")msg="The evidence tells a similar story. You can explore possible reasons, but it does not yet tell you what caused the pattern.";else if(rel==="The evidence is mixed")msg="The evidence shows different patterns. Find out which scholars or settings differ before deciding what to do.";else if(rel==="The evidence appears to conflict")msg="The evidence seems to disagree. Check whether it covers the same scholars, time period, and setting before drawing a conclusion.";else if(rel.includes("cannot compare"))msg="These results cannot be compared fairly yet. Check that they cover the same scholars, time period, or setting.";else if(rel.includes("another kind"))msg="We need more information. Write down what is missing and who will find it.";else msg="The team has an observation, but still needs to characterize how the evidence relates across sources.";window._obs={obs,rel,checked,msg};showModal(`<div class="label">OBSERVE</div><h2>What we can say about the evidence so far</h2><div class="compare"><strong>Team observation:</strong><br>${esc(obs)}</div><div class="signal"><strong>Across the evidence:</strong><br>${esc(msg)}</div><div class="signal"><strong>Checks completed:</strong><br>${checked.length?esc(checked.join(" · ")):"No comparison checks marked yet."}</div><div class="section"><div class="label">Are we describing what happened or guessing why?</div><div class="muted">A useful test: if the statement answers <b>what is happening</b>, it belongs in OBSERVE. If it answers <b>why it is happening</b>, it belongs in EXPLAIN.</div></div><div class="row"><button class="btn ghost" onclick="analysisWorkbench()">Revise observation</button><button class="btn primary" onclick="explainFromObserve()">Move to EXPLAIN</button></div>`)}
function explainFromObserve(){let o=window._obs||{};showModal(`<div class="label">EXPLAIN</div><h2>Check whether our explanation fits the evidence</h2><div class="compare"><strong>What we observed:</strong><br>${esc(o.obs||"")}</div><div class="section"><label class="muted"><b>Why might this pattern be happening?</b></label><textarea class="input" id="why1" placeholder="Possible explanation 1"></textarea><textarea class="input" id="why2" placeholder="Possible explanation 2 — optional"></textarea><textarea class="input" id="why3" placeholder="Possible explanation 3 — optional"></textarea></div><div class="section"><label class="muted"><b>Which possible reason fits the evidence best?</b></label><textarea class="input" id="bestwhy"></textarea><label class="muted"><b>What evidence supports it?</b></label><textarea class="input" id="supportwhy"></textarea><label class="muted"><b>What information might show that this explanation is wrong?</b></label><textarea class="input" id="challengewhy"></textarea><label class="muted"><b>What have we already tried, and what happened?</b></label><textarea class="input" id="priorwhy"></textarea></div><div class="row"><button class="btn ghost" onclick="interpretObserve()">Back to OBSERVE</button><button class="btn primary" onclick="testExplanation()">Test this explanation</button></div>`)}

function saveWorkbench(){let o=window._obs||{},e=window._exp||{};cur.since="The team compared multiple pieces of evidence and clarified what the pattern does—and does not—show.";cur.know=`Observed: ${o.obs||""} Current explanation: ${e.best||""} Supporting evidence: ${e.sup||"not yet established"}.`;cur.where=e.strength==="Testable"?"EXPLAIN — explanation is testable against the evidence.":"EXPLAIN — explanation needs stronger evidence before planning.";cur.questions=[e.chall?`Check whether this is true: ${e.chall}`:"What evidence would weaken or challenge the current explanation?"];cur.next=e.strength==="Testable"?"Decide whether the explanation is strong enough to move into PLAN.":"Gather the missing evidence before selecting a response.";cur.history.push([new Date().toLocaleDateString("en-US",{month:"short",day:"numeric"}),"OBSERVE + EXPLAIN updated"]);save();closeModal();openP(cur.id)}

function interpretReview(){let i=rvImpl.value,o=rvImpact.value;if(!i||!o)return alert("Choose both implementation and outcome status.");let cls="hold",h="",m="",n="";if(i==="We do not know yet"||o==="We do not know yet"){h="We need more information first";m="The team is missing evidence needed to judge the response.";n="Gather the missing implementation or outcome evidence before changing the plan."}else if(["Partly","Very little / not at all"].includes(i)){h="Carry out the plan consistently before judging results";m="The response did not occur consistently enough to make a fair claim about whether it works.";n="Identify the implementation barrier, adjust it, and review again."}else if(["Yes — consistently","Mostly"].includes(i)&&["Little or no change","Got worse"].includes(o)){cls="rethink";h="Take another look at the reason and the plan";m="Implementation was reasonably strong, but the intended outcome did not improve.";n="Return to EXPLAIN: reconsider the reason for the pattern, the match of the response, or its intensity."}else if(["Yes — consistently","Mostly"].includes(i)&&["Improved clearly","Improved somewhat"].includes(o)){cls="go";h="Keep going, and check which scholars benefited";m="The response was implemented and the intended outcome improved.";n="Continue while checking for scholars/groups/settings where improvement is weaker."}else{h="Results are mixed";m="Do not collapse mixed results into one average conclusion.";n="Compare who improved with who did not before changing the whole plan."}window._review={i,o,h,m,n};showModal(`<div class="label">REVIEW</div><h2>${esc(h)}</h2><div class="decision ${cls}"><b>${esc(m)}</b><br>${esc(n)}</div><div class="planstrip"><div class="planbox"><b>Implementation</b>${esc(i)}</div><div class="planbox"><b>Impact</b>${esc(o)}</div><div class="planbox"><b>Next decision</b>${esc(n)}</div></div><div class="row"><button class="btn ghost" onclick="reviewPlan()">Revise</button><button class="btn primary" onclick="saveReview() function dataNow(priorityId){let p=typeof priorityId==='number'?D.priorities.find(x=>x.id===priorityId):cur&&D.priorities.includes(cur)?cur:null;let m=new Date().getMonth()+1,month=new Date().toLocaleDateString('en-US',{month:'long'}),items=CALENDAR[m]||[];calDraft={priorityId:p?p.id:null,selected:[...((p&&p.calendarSelection&&p.calendarSelection.month===m)?p.calendarSelection.ids:[])],month:m,notes:(p&&p.calendarSelection&&p.calendarSelection.month===m)?p.calendarSelection.notes:'',available:(p&&p.calendarSelection&&p.calendarSelection.month===m)?p.calendarSelection.available:{}};renderDataCalendar()}
function renderDataCalendar(){let d=calDraft,m=d.month,p=D.priorities.find(x=>x.id===d.priorityId),items=CALENDAR[m]||[],month=new Date(2026,m-1,1).toLocaleDateString('en-US',{month:'long'});showModal(`<div class="label">GRPS DATA CONVERSATION CALENDAR</div><h2>${month}: What data should we look at?</h2><p class="muted">Start with your team's question. Select only the evidence that will help you understand it.</p><label class="cal-label" for="cal-priority">1. Which priority are we working on?</label><select class="input" id="cal-priority" onchange="calendarChangePriority(this.value)"><option value="">Exploring data — no priority selected</option>${D.priorities.filter(x=>x.status!=='closed').map(x=>`<option value="${x.id}" ${x.id===d.priorityId?'selected':''}>${esc(x.title)}</option>`).join('')}</select>${p?`<div class="cal-context"><b>Our question</b><div>${esc(p.issue)}</div><small>Areas: ${p.areas.map(esc).join(' + ')||'Not specified'}</small></div>`:`<p class="sourcehint">Choose a priority to save your selections and observations directly to that work.</p>`}<div class="cal-label">2. Which evidence will help?</div><div class="cal-list">${items.map(x=>`<div class="cal-item"><label class="cal-check"><input type="checkbox" ${d.selected.includes(x[0])?'checked':''} onchange="calendarToggle('${x[0]}',this.checked)"><span><b>${esc(x[1])}</b><small>${esc(x[2])}</small><em>Likely source: ${esc(x[3])}</em></span></label>${d.selected.includes(x[0])?`<div class="cal-availability"><label for="cal-av-${x[0]}">Can your team access this evidence?</label><select id="cal-av-${x[0]}" onchange="calendarAvailability('${x[0]}',this.value)"><option value="" ${!d.available[x[0]]?'selected':''}>Not checked yet</option><option value="yes" ${d.available[x[0]]==='yes'?'selected':''}>Yes — ready to review</option><option value="no" ${d.available[x[0]]==='no'?'selected':''}>Not available yet</option><option value="unsure" ${d.available[x[0]]==='unsure'?'selected':''}>Not sure — need to check</option></select></div>`:''}</div>`).join('')||'<p>No specific items are listed for this month in the GRPS source calendar. Choose a priority and use its question to identify relevant evidence.</p>'}</div><div class="cal-label">3. What do we notice or still need to find out?</div><textarea class="input" id="cal-notes" rows="3" placeholder="For example: Compare the same scholars across attendance and literacy results, and check which data are available.">${esc(d.notes)}</textarea><div class="cal-links"><b>Open GRPS data sources</b><div>${DATA_LINKS.map(([n,u])=>`<a class="linkbtn" href="${u}" target="_blank" rel="noopener noreferrer">${n} ↗</a>`).join('')}</div></div><details class="cal-dates"><summary>View assessment dates and release reminders</summary><p>Fall MAP: early–mid September results. Winter MAP: mid–late January. Spring MAP: early May. Fall College Board: later October. Spring WIDA ACCESS: late June–early July. MSTEP / MI-Access: preliminary results after testing; later public release. Confirm actual availability in the relevant GRPS system.</p></details><div class="cal-footer"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="calendarSave()" ${d.selected.length?'':'disabled'}>${p?'Save to this priority':'Choose evidence to continue'}</button></div>`)}
function calendarChangePriority(id){calDraft.notes=document.getElementById('cal-notes').value;calDraft.priorityId=id?Number(id):null;let p=D.priorities.find(x=>x.id===calDraft.priorityId);if(p&&p.calendarSelection&&p.calendarSelection.month===calDraft.month){calDraft.selected=[...p.calendarSelection.ids];calDraft.notes=p.calendarSelection.notes||'';calDraft.available={...p.calendarSelection.available}}renderDataCalendar()}
function calendarToggle(id,yes){calDraft.notes=document.getElementById('cal-notes').value;calDraft.selected=yes?[...new Set([...calDraft.selected,id])]:calDraft.selected.filter(x=>x!==id);renderDataCalendar()}
function calendarAvailability(id,value){calDraft.available[id]=value}
function calendarSave(){let d=calDraft;if(!d)return;d.notes=document.getElementById('cal-notes').value;let p=D.priorities.find(x=>x.id===d.priorityId);if(!p)return alert('Choose a priority so the team can return to this evidence at the next meeting.');if(!d.selected.length)return alert('Select at least one source of evidence.');let items=CALENDAR[d.month]||[],names=d.selected.map(id=>items.find(x=>x[0]===id)).filter(Boolean).map(x=>x[1]);p.calendarSelection={month:d.month,ids:[...d.selected],available:{...d.available},notes:d.notes,date:new Date().toISOString()};p.evidence=p.evidence||{};p.evidence['Selected for review']=names.join('; ');if(d.notes.trim())p.evidence['Calendar observations / questions']=d.notes.trim();let missing=d.selected.filter(id=>d.available[id]==='no'||d.available[id]==='unsure');if(missing.length){D.parking=D.parking||[];let missingNames=missing.map(id=>items.find(x=>x[0]===id)).filter(Boolean).map(x=>x[1]);D.parking.push({q:'Check access to: '+missingNames.join(', '),owner:'Assign at next team meeting',next:'Return to '+p.title+' once evidence is available',priorityId:p.id});p.questions=p.questions||[];p.questions.push('Check access to '+missingNames.join(', '));}p.history=p.history||[];p.history.push([new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'}),'Selected evidence for review: '+names.join(', ')]);save();cur=p;closeModal();openP(p.id)}
function dataForPriority(){let a=cur.areas.join(" ").toLowerCase(),cards=[];if(a.includes("attendance"))cards.push(["Attendance","Chronic absenteeism; patterns over time; scholars/groups driving the pattern; grade/course/period/day patterns when relevant.","Synergy"]);if(a.includes("academic"))cards.push(["Academic","Use the assessment, course, classroom, skill, or grade evidence that directly answers the team's question.","Our School Data · Synergy · MI School Data"]);if(a.includes("behavior"))cards.push(["Behavior / PBIS+","Compare setting, time, scholar/group, adult-practice, and implementation patterns.","Synergy / applicable GRPS behavior evidence"]);if(a.includes("experience"))cards.push(["Scholar / Family / Staff Experience","Use experience evidence to test—not replace—the outcome and implementation evidence.","GRPS survey / local feedback evidence"]);if(!cards.length)cards.push(["Start with the question","Identify the 2–3 pieces of evidence most likely to answer this priority's question.","Use the relevant GRPS platform"]);showModal(`<div class="label">DATA FOR THIS QUESTION</div><h2>Which information will help answer our question?</h2><div class="muted">You do not need every report. Start with the two or three pieces of information that best answer your question.</div>${cards.map(c=>`<div class="nowcard"><h3>${esc(c[0])}</h3><div>${esc(c[1])}</div><div class="micro" style="margin-top:5px"><b>Likely source:</b> ${esc(c[2])}</div></div>`).join("")}<div class="section"><div class="label">GRPS data platforms</div><a class="linkbtn" href="https://www.mischooldata.org/" target="_blank">MI School Data ↗</a><a class="linkbtn" href="https://ourschooldata.org/Identity/Account/LoginEmail?returnUrl=%2F" target="_blank">Our School Data ↗</a><a class="linkbtn" href="https://mdoe.state.mi.us/meis/login.aspx" target="_blank">MEIS ↗</a><a class="linkbtn" href="https://synergy.grps.org/" target="_blank">Synergy ↗</a></div><div class="row"><button class="btn ghost" onclick="dataNow()">What's timely now?</button><button class="btn primary" onclick="closeModal()">Back to priority</button></div>`)}
function originalTools(){
 const resources=[
  {name:"Data Conversation Process",desc:"Use the original GRPS Focus → Observe → Explain → Plan guide during a team discussion.",links:[["Open process guide","https://drive.google.com/file/d/1lFI0q-e718l796YGfvoxIiQ8pBVU12Fq/view"]]},
  {name:"Monthly Data Review Cycle",desc:"Open the GRPS monthly form to document the building's review.",links:[["Open monthly review form","https://docs.google.com/document/d/1y8PQ4Gz3jZ4JGxwAkcvWBiuTwp2N_n1RjBjWJqSKmAg/edit"]]},
  {name:"Data Conversation Calendar",desc:"See the original GRPS monthly guide for which evidence to consider.",links:[["Open monthly calendar","https://drive.google.com/file/d/1R-kAmg8PRVNoeJeiIOOJ3cWSY5qGH_ci/view"]]},
  {name:"Assessment Data Calendar",desc:"Check testing and expected assessment-data release windows.",links:[["Open assessment calendar","https://drive.google.com/file/d/1CN_Sp69Zt2PCKu4GLBBMowZY24wbqzgV/view"]]},
  {name:"Action Step Parking Lot",desc:"Track unresolved questions, data needs, owners, next steps and findings.",links:[["Open original parking lot","https://docs.google.com/document/d/1kLJQg1Aj_8bke24y0Lcr-1kjvc_pb7VNw2YmOQBDJNE/edit"]]},
  {name:"GRPS Meeting Agenda",desc:"Use the original meeting roles, discussion structure and closing routine.",links:[["Open meeting agenda","https://docs.google.com/document/d/1DINTmpLIgxKqS35NXrZiG2ML3DqfEP-WS53-Vx1SYpY/edit"]]},
  {name:"Data Platform Links",desc:"Open the GRPS directory of data platforms, or go directly to the platform you need.",links:[["Open GRPS platform directory","https://docs.google.com/document/d/1bUxMNlxlrCgzPIN9cD4wwsDCAvJ4TCHPGB8BIyD7CdE/edit"],["MI School Data","https://www.mischooldata.org/"],["Our School Data","https://ourschooldata.org/Identity/Account/LoginEmail?returnUrl=%2F"],["MEIS","https://mdoe.state.mi.us/meis/login.aspx"],["Synergy","https://synergy.grps.org/"]]}
 ];
 showModal(`<div class="label">GRPS resources</div><h2>Open the resource you need</h2><p class="muted">Select a resource below to open the original GRPS document in a new tab. Some GRPS documents require district access.</p><div class="resource-list">${resources.map(r=>`<div class="resource-link-card"><h3>${esc(r.name)}</h3><p>${esc(r.desc)}</p><div class="resource-link-actions">${r.links.map(([label,url])=>`<a class="btn ghost" href="${url}" target="_blank" rel="noopener noreferrer" aria-label="${esc(label)} (opens in a new tab)">${esc(label)} ↗</a>`).join('')}</div></div>`).join('')}</div><div class="row"><span></span><button class="btn primary" onclick="closeModal()">Back to the work</button></div>`)
}
function showModal(x){modal.className="modal";modal.innerHTML=`<div class="modalbox">${x}</div>`}function closeModal(){modal.className="";modal.innerHTML=""}
// Record the previous full page. Dialogs close first when Back is pressed.
let navCurrent={name:"home",args:[]},navHistory=[],navRestoring=false;
for(const name of ["home","openP","today","meetingPrep"]){
  const original=window[name];
  window[name]=function(...args){
    if(!navRestoring && (navCurrent.name!==name || JSON.stringify(navCurrent.args)!==JSON.stringify(args))){
      navHistory.push({...navCurrent});if(navHistory.length>30)navHistory.shift();
    }
    navCurrent={name,args};original(...args);
  };
}
function navHome(){closeModal();navHistory=[];navRestoring=true;home();navRestoring=false;window.scrollTo(0,0)}
function navBack(){
  if(modal.classList.contains("modal")){closeModal();return}
  const previous=navHistory.pop();
  navRestoring=true;
  if(previous && typeof window[previous.name]==="function")window[previous.name](...previous.args);
  else home();
  navRestoring=false;window.scrollTo(0,0);
}
home();
